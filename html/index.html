<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablet</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="nui://hf_assets/fontawesome/css/all.min.css" data-hf-asset="/hf_assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="nui://hf_assets/hexa-theme.css" data-hf-asset="/hf_assets/hexa-theme.css">
    <script data-hf-preview-bridge>
      (() => {
        const isNui = location.protocol === 'nui:' || /^cfx-nui-/.test(location.hostname);
        if (isNui) return;

        document.querySelectorAll('link[data-hf-asset]').forEach((node) => {
          node.href = node.dataset.hfAsset;
        });

        window.addEventListener('DOMContentLoaded', () => {
          document.querySelectorAll('img[data-hf-asset]').forEach((node) => {
            node.src = node.dataset.hfAsset;
          });

          if (new URLSearchParams(location.search).get('hfpreview') !== '1') return;
          document.body.classList.add('open', 'hf-preview');
          document.querySelectorAll('#app, #mdt-container, #rentalContainer, #tablet-container, #game-container, #textui, #msgbox').forEach((node) => {
            node.classList.remove('hidden', 'tablet-hidden');
            node.classList.add('visible');
            node.style.removeProperty('display');
            node.style.removeProperty('visibility');
            node.style.removeProperty('opacity');
          });
        });
      })();
    </script>
</head>
<body data-hf-ui="hf_tablet">
    <!-- Tablet Container -->
    <div id="tablet-container" class="tablet-hidden">
        <!-- Tablet Device -->
        <div class="tablet-device">
            <!-- Status Bar -->
            <div class="status-bar nb-has-lockup">
                <div class="status-left">
                    <div class="nb-logo-chip"><img src="nui://hf_assets/hexa-forge.jpg" data-hf-asset="/hf_assets/hexa-forge.jpg" alt="Hexa Forge" /></div>
                    <div class="nb-lockup-text">
                        <span class="nb-eyebrow">HEXA FORGE · TABLET</span>
                    </div>
                    <span id="current-time">00:00</span>
                </div>
                <div class="status-center">
                    <span id="page-title">ホーム</span>
                </div>
                <div class="status-right">
                    <i class="fas fa-wifi"></i>
                    <i class="fas fa-battery-three-quarters"></i>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content-area" id="content-area">
                <!-- Home Screen -->
                <div id="home-screen" class="screen active">
                    <div class="app-grid" id="app-grid">
                        <!-- Apps will be dynamically loaded here -->
                    </div>
                    <!-- Edit mode indicator -->
                    <div id="edit-mode-banner" class="edit-mode-banner hidden">
                        <i class="fas fa-pencil-alt"></i>
                        <span>編集モード — アイコンをドラッグして移動・重ねてフォルダ作成</span>
                        <button id="edit-mode-done" class="edit-done-btn">完了</button>
                    </div>
                </div>

                <!-- Folder Overlay -->
                <div id="folder-overlay" class="folder-overlay hidden">
                    <div class="folder-overlay-backdrop" id="folder-backdrop"></div>
                    <div class="folder-popup">
                        <div class="folder-header">
                            <input type="text" id="folder-name-input" class="folder-name-input" value="フォルダ" maxlength="20">
                            <button id="folder-close-btn" class="folder-close-btn">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="folder-grid" id="folder-grid">
                            <!-- Folder apps will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Settings Screen -->
                <div id="settings-screen" class="screen">
                    <div class="settings-container">
                        <h2><i class="fas fa-cog"></i> 設定</h2>

                        <!-- 壁紙設定 -->
                        <div class="settings-section">
                            <h3><i class="fas fa-palette"></i> 壁紙</h3>
                            <div class="setting-item">
                                <label>背景タイプ</label>
                                <div class="bg-type-toggle">
                                    <button class="bg-type-btn active" data-type="color" id="bg-type-color">
                                        <i class="fas fa-fill-drip"></i> カラー
                                    </button>
                                    <button class="bg-type-btn" data-type="image" id="bg-type-image">
                                        <i class="fas fa-image"></i> 画像
                                    </button>
                                </div>
                            </div>

                            <!-- Color Picker Section -->
                            <div id="color-settings" class="sub-settings">
                                <div class="setting-item">
                                    <label>背景色</label>
                                    <div class="color-picker-wrapper">
                                        <input type="color" id="bg-color-picker" value="#1a1a1a" class="color-picker-input">
                                        <span id="bg-color-hex" class="color-hex-label">#1a1a1a</span>
                                    </div>
                                </div>
                                <div class="setting-item">
                                    <label>プリセットカラー</label>
                                </div>
                                <div class="preset-colors" id="preset-colors">
                                    <button class="preset-color-btn" data-color="#1a1a1a" style="background:#1a1a1a;" title="ダークブラック"></button>
                                    <button class="preset-color-btn" data-color="#0f0f23" style="background:#0f0f23;" title="ディープネイビー"></button>
                                    <button class="preset-color-btn" data-color="#1a0a2e" style="background:#1a0a2e;" title="ダークパープル"></button>
                                    <button class="preset-color-btn" data-color="#0a192f" style="background:#0a192f;" title="ミッドナイトブルー"></button>
                                    <button class="preset-color-btn" data-color="#162447" style="background:#162447;" title="ネイビー"></button>
                                    <button class="preset-color-btn" data-color="#1b2631" style="background:#1b2631;" title="チャコール"></button>
                                    <button class="preset-color-btn" data-color="#2d1b69" style="background:#2d1b69;" title="パープル"></button>
                                    <button class="preset-color-btn" data-color="#1e3a5f" style="background:#1e3a5f;" title="オーシャンブルー"></button>
                                    <button class="preset-color-btn" data-color="#2c3e50" style="background:#2c3e50;" title="ウェットアスファルト"></button>
                                    <button class="preset-color-btn" data-color="#1a3c34" style="background:#1a3c34;" title="ダークフォレスト"></button>
                                    <button class="preset-color-btn" data-color="#3c1a1a" style="background:#3c1a1a;" title="ダークレッド"></button>
                                    <button class="preset-color-btn" data-color="#4a1942" style="background:#4a1942;" title="マゼンタ"></button>
                                </div>
                            </div>

                            <!-- Image URL Section -->
                            <div id="image-settings" class="sub-settings hidden">
                                <div class="setting-item column">
                                    <label>画像URL</label>
                                    <div class="image-url-wrapper">
                                        <input type="text" id="bg-image-url" class="text-input" placeholder="https://example.com/background.jpg">
                                        <button id="bg-image-apply" class="btn-small">
                                            <i class="fas fa-check"></i> 適用
                                        </button>
                                    </div>
                                </div>
                                <div class="setting-item">
                                    <label>プレビュー</label>
                                </div>
                                <div class="image-preview-container">
                                    <div id="bg-image-preview" class="image-preview">
                                        <i class="fas fa-image"></i>
                                        <span>画像URLを入力してください</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ディスプレイ設定 -->
                        <div class="settings-section">
                            <h3><i class="fas fa-desktop"></i> ディスプレイ</h3>
                            <div class="setting-item">
                                <label>明るさ</label>
                                <input type="range" min="50" max="100" value="100" id="brightness-slider">
                            </div>
                        </div>

                        <!-- レイアウト設定 -->
                        <div class="settings-section">
                            <h3><i class="fas fa-th"></i> レイアウト</h3>
                            <div class="setting-item">
                                <label>レイアウトをリセット</label>
                                <button class="btn-danger" id="reset-layout-btn">
                                    <i class="fas fa-undo"></i> リセット
                                </button>
                            </div>
                        </div>

                        <!-- 情報 -->
                        <div class="settings-section">
                            <h3><i class="fas fa-info-circle"></i> 情報</h3>
                            <div class="setting-item">
                                <label>バージョン</label>
                                <span>2.0.0</span>
                            </div>
                        </div>

                        <button class="btn-primary" onclick="goHome()">
                            <i class="fas fa-arrow-left"></i> 戻る
                        </button>
                    </div>
                </div>
            </div>

            <!-- Navigation Bar -->
            <div class="navigation-bar">
                <button class="nav-btn" onclick="goBack()">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="nav-btn nav-home" onclick="goHome()">
                    <i class="fas fa-circle"></i>
                </button>
                <button class="nav-btn" onclick="closeTablet()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
      document.write('<scr' + 'ipt src="' + ((location.protocol === 'nui:' || /^cfx-nui-/.test(location.hostname)) ? 'nui://hf_assets/' : '/hf_assets/') + 'jquery-3.6.0.min.js"><\/scr' + 'ipt>');
    </script>
    <script src="js/app.js"></script>
</body>
</html>
